name: Validate Pro Python Skill Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate SKILL.md and Chapter Structure
        run: |
          python3 scripts/validate_skill.py

      - name: Test Example Python Scripts
        run: |
          python3 -m py_compile examples/*.py
          python3 examples/01_cooperative_multiple_inheritance.py
          python3 examples/02_plugin_registry_init_subclass.py
          python3 examples/03_type_safe_decorator.py
          python3 examples/04_structural_protocol.py
          echo "✅ All examples executed successfully"
